<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121519">
<meta name="description" content="Your personal gym trainer: plan, log, recover, eat right.">

</head><body>
<title>Ironcoach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: gym-floor whiteboard. Coach card + week strip on top, workout column left, recovery/fuel sidebar right. Plate colours (red 25 / blue 20 / yellow 15 / green 10) carry meaning. */
:root{
  --bg:#121519; --surface:#1A1E23; --surface2:#232830; --line:#2F353E;
  --fg:#ECEDE8; --muted:#8E96A0; --fig:#ECEDE8; --fig-far:#5B636D;
  --blue:#4F86FF; --red:#EF5350; --yellow:#F5C451; --green:#3DBE7A;
  --on-accent:#0B0E12; --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F1F2EE; --surface:#FFFFFF; --surface2:#ECEEEA; --line:#D9DCD6;
  --fg:#15181C; --muted:#5D646C; --fig:#1B1F24; --fig-far:#A9AFB6;
  --blue:#2B60DD; --red:#D93B38; --yellow:#C9900E; --green:#1F9A5B;
  --on-accent:#FFFFFF; --shadow:0 8px 24px rgba(20,25,30,.08); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F1F2EE; --surface:#FFFFFF; --surface2:#ECEEEA; --line:#D9DCD6;
  --fg:#15181C; --muted:#5D646C; --fig:#1B1F24; --fig-far:#A9AFB6;
  --blue:#2B60DD; --red:#D93B38; --yellow:#C9900E; --green:#1F9A5B;
  --on-accent:#FFFFFF; --shadow:0 8px 24px rgba(20,25,30,.08); color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;padding-block:10px}
.brand{font:800 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:22px;border-radius:2px;background:var(--blue);box-shadow:5px 0 0 var(--red),10px 0 0 var(--yellow)}
.brand span{color:var(--blue)}
nav#nav{display:flex;gap:4px;margin-left:auto}
nav#nav a{font:600 15px/1 var(--body);color:var(--muted);text-decoration:none;padding:10px 14px;border-radius:8px;display:flex;align-items:center;gap:8px}
nav#nav a svg{width:20px;height:20px}
nav#nav a[aria-current="page"]{color:var(--fg);background:var(--surface2)}
.sync{font:500 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
main{padding-block:20px 120px}
@media (max-width:760px){
  nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav#nav a{flex-direction:column;gap:3px;font-size:11px;padding:6px 8px}
  .sync{margin-left:auto}
  main{padding-bottom:150px}
}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.01em}
h1{font-size:clamp(34px,6vw,52px);font-weight:800;text-transform:uppercase}
h2{font-size:24px;font-weight:700;text-transform:uppercase}
h3{font-size:21px;font-weight:700}
p{margin:0}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 13px/1 var(--body);padding:7px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--fg)}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
.pill.g{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.pill.y{background:color-mix(in srgb,var(--yellow) 20%,transparent);color:var(--yellow)}
.pill.r{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.pill.b{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--yellow);border-radius:12px;padding:12px 14px;color:var(--fg);background:color-mix(in srgb,var(--yellow) 8%,transparent)}

/* coach hero */
.coach{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}
.coach::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:22px solid color-mix(in srgb,var(--blue) 14%,transparent)}
.coach .say{font-size:17px;max-width:62ch;margin-top:10px}
.coach .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ring{position:relative;width:96px;height:96px;z-index:1}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px/1 var(--display)}
.ring small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.coach{grid-template-columns:1fr}.ring{display:none}}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.wd .d{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wd .s{font:700 14px/1.1 var(--display);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd.rest .s{color:var(--muted);font-weight:600}
.wd.today{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.wd .ok{display:block;height:4px;border-radius:2px;margin:7px auto 0;width:60%;background:var(--line)}
.wd.done .ok{background:var(--green)}

/* exercise cards */
.exc{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.exc.done{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.figbtn{border:0;padding:0;background:var(--surface2);border-radius:10px;aspect-ratio:1;width:100%;max-width:100%;display:block;position:relative}
.figbtn .play{position:absolute;left:6px;bottom:6px;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--bg);color:var(--fg);padding:4px 6px;border-radius:4px}
svg.fig{width:100%;height:100%;display:block}
svg.fig .limb{fill:none;stroke:var(--fig);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
svg.fig .far{stroke:var(--fig-far)}
svg.fig .torso{stroke-width:12}
svg.fig .head{fill:var(--fig)}
svg.fig .floor{stroke:var(--line);stroke-width:2}
svg.fig .prop{fill:var(--surface);stroke:var(--muted);stroke-width:2}
svg.fig .pline{stroke:var(--muted);stroke-width:4;stroke-linecap:round;fill:none}
svg.fig .pad{stroke:var(--muted);stroke-width:9;stroke-linecap:round;fill:none}
svg.fig .plate{fill:var(--red);stroke:var(--bg);stroke-width:2}
svg.fig .hub{fill:var(--bg)}
svg.fig .db{fill:var(--blue)}
svg.fig .kb{fill:var(--yellow)}
svg.fig .cable{stroke:var(--muted);stroke-width:2}
svg.fig .ghost{opacity:.28}
.exbody{min-width:0;display:flex;flex-direction:column;gap:8px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rx{font:600 15px/1.3 var(--mono);color:var(--fg)}
.rx span{color:var(--muted);font-weight:500}
.hint{font-size:14px;color:var(--muted)}
.hint b{color:var(--fg);font-weight:600}
.warn{color:var(--yellow);font-size:14px;font-weight:600}
table.sets{border-collapse:collapse;width:100%;max-width:420px}
table.sets th{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px}
table.sets td{padding:3px 6px}
table.sets td:first-child{font:600 14px var(--mono);color:var(--muted);width:36px}
table.sets input{width:100%;max-width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
table.sets tr.ok input{border-color:color-mix(in srgb,var(--green) 60%,var(--line));background:color-mix(in srgb,var(--green) 10%,var(--surface2))}
.tick{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
tr.ok .tick{background:var(--green);border-color:var(--green);color:var(--on-accent)}
@media (max-width:560px){.exc{grid-template-columns:96px minmax(0,1fr);gap:12px}}

/* sidebar bits */
.meter{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-weight:500;min-width:0;width:100%}
.field output{font:600 14px var(--mono);color:var(--blue)}
input[type=range]{accent-color:var(--blue);padding:0!important;border:0!important;background:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice label{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.choice label:has(input:focus-visible){outline:2px solid var(--blue)}
.choice b{font:700 18px/1.1 var(--display);text-transform:uppercase}
.choice small{color:var(--muted);font-size:13px;line-height:1.35}

/* library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.libcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.libcard:hover{border-color:var(--muted)}
.libcard .figbox{background:var(--surface2);border-radius:10px;aspect-ratio:1;max-width:100%}
.libcard b{font:700 18px/1.1 var(--display)}
.libcard small{color:var(--muted);font-size:13px}
.search{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:360px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.6);display:grid;place-items:center;padding:16px}
#sheet .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:880px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:var(--shadow)}
.detail{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px}
.detail .figbox{background:var(--surface2);border-radius:14px;aspect-ratio:1;max-width:100%}
@media (max-width:720px){.detail{grid-template-columns:minmax(0,1fr)}.detail .figbox{max-width:300px;margin:0 auto;width:100%}}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ul.bad{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}

/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);width:min(440px,calc(100% - 32px))}
#timer .t{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
#timer .lbl{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
#timer .tb{height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;margin-top:6px}
#timer .tb i{display:block;height:100%;background:var(--blue)}
#timer button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px}
@media (max-width:760px){#timer{bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--surface2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.big{font:800 40px/1 var(--display)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font:700 30px/1 var(--display)}
.stat .l{font-size:13px;color:var(--muted)}
.chartbox{overflow-x:auto}
.chartbox svg text{fill:var(--muted);font:11px var(--mono)}
.list{display:flex;flex-direction:column}
.list > div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.list > div:first-child{border-top:0}
.answer{white-space:pre-wrap;font-size:15px;background:var(--surface2);border-radius:10px;padding:12px;min-height:20px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.figimg{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
svg.figph text{fill:var(--muted);font:700 54px var(--display)}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface2)}
.preview{width:240px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.upl{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ai{border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.ai .eyebrow{color:var(--blue)}
.airow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.airow.off{opacity:.45;text-decoration:line-through}
.feedback{background:color-mix(in srgb,var(--yellow) 10%,var(--surface2));border-left:3px solid var(--yellow);border-radius:8px;padding:10px 12px;font-size:15px}
.meal{display:flex;gap:12px;align-items:center;min-width:0}
.meal > span{min-width:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap topin">
  <div class="brand"><i aria-hidden="true"></i>Iron<span>coach</span></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="sync" id="sync">Saved on this device</div>
</div></header>
<main class="wrap" id="view"></main>
<div id="timer" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const todayStr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return todayStr(d)};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtDate=s=>{const d=new Date(s+"T12:00:00");return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})};
const mmss=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------------- exercise library ---------------- */
const MUSCLES={chest:"Chest",back:"Back",shoulders:"Shoulders",biceps:"Biceps",triceps:"Triceps",quads:"Quads",glutes:"Glutes & hams",calves:"Calves",core:"Core"};
const EQUIP={barbell:"Barbell",dumbbell:"Dumbbells",machine:"Machine / cable",cardio:"Cardio machine",bodyweight:"Bodyweight",bar:"Pull-up bar",kettlebell:"Kettlebell"};
const ST={h:[102,42],s:[100,56],e:[100,84],w:[102,110],p:[100,104],k:[100,142],a:[100,178],t:[110,180]};
const P=(b,o)=>Object.assign({},b,o||{});
const shiftY=(b,dy,keep)=>{const o={};for(const k in b)o[k]=Array.isArray(b[k])&&!keep.includes(k)?[b[k][0],b[k][1]+dy]:b[k];return o};
const SQ_B={h:[116,82],s:[110,96],e:[98,108],w:[106,98],p:[88,140],k:[124,150],a:[100,178],t:[110,180]};
const DL_A={h:[138,100],s:[126,108],e:[126,136],w:[126,162],p:[84,130],k:[112,146],a:[100,178],t:[110,180]};
const RDL_B={h:[140,96],s:[128,100],e:[128,126],w:[128,150],p:[84,108],k:[104,142],a:[100,178],t:[110,180]};
const BENCH={h:[52,120],s:[66,124],p:[116,124],k:[148,132],a:[150,176],t:[160,178]};
const INCL={h:[76,90],s:[84,104],p:[110,140],k:[146,138],a:[146,178],t:[156,180]};
const HANG={h:[102,60],s:[100,74],e:[100,48],w:[100,22]};
const ROW={h:[138,90],s:[126,96],p:[84,112],k:[108,146],a:[100,178],t:[110,180]};
const SEAT={h:[94,78],s:[92,92],p:[96,140],k:[130,136],a:[128,174],t:[138,178]};
const PLANK={h:[44,128],s:[56,134],e:[58,156],w:[58,178],p:[104,150],k:[132,162],a:[160,174],t:[166,180]};
const FRONT={front:true,h:[100,40],s:[114,58],e:[118,84],w:[120,108],p:[108,106],k:[110,142],a:[110,178],t:[118,180]};

const EX=[

const avail=ex=>!!ex&&EQUIPSET[S.profile.equip].includes(ex.equip);

function buildSession(key,d){
  const day=S.days[d]||{};const used=new Set();let list=[];
  TPL[key][1].forEach((slot,i)=>{let id=day.swaps&&day.swaps[i];if(!id||!avail(EXM[id])||used.has(id))id=cands(slot).find(x=>!used.has(x));if(id){used.add(id);list.push({slot,i,ex:EXM[id]})}});
  list=list.slice(0,{beginner:5,intermediate:7,advanced:8}[S.profile.level]||7);
  list=list.concat(buildAdded(d,used));
  if(S.profile.goal==="fatloss"||S.profile.goal==="fitness"){const i=99;let id=day.swaps&&day.swaps[i];if(!id||!avail(EXM[id])||used.has(id))id=cands("cardio").find(x=>!used.has(x));if(id)list.push({slot:"cardio",i,ex:EXM[id],finisher:true})}

}

  else if(ex.kind==="cardio")r={sets:g==="fatloss"?4:3,reps:"40 s work",lo:40,hi:40,rest:20,timed:true};
  else{const t=TABLE[g][ex.kind==="compound"?"c":"i"];r={sets:t[0],reps:t[1]+"–"+t[2],lo:t[1],hi:t[2],rest:t[3]}}

  if(S.profile.level==="advanced"&&ex.kind==="compound")r.sets+=1;

function suggest(ex,r,d){
  const lp=lastPerf(ex.id,d);
  if(r.timed)return{w:"",text:lp?`Last time: <b>${lp.sets.map(s=>s.r+" s").join(", ")}</b>. Add 5 seconds if it felt easy.`:"Hold good form for the whole interval."};
  if(!lp)return{w:"",text:ex.equip==="bodyweight"||ex.equip==="bar"?"Bodyweight. Leave 1–2 reps in the tank on each set.":"First time: pick a weight you could lift 2–3 more reps with good form."};
  const w=Math.max(...lp.sets.map(s=>+s.w||0));const reps=lp.sets.map(s=>s.r).join(", ");

  if(!w)return{w:"",text:`Last time: <b>${reps} reps</b>. ${top?"Hit the top of the range, so add a slow 3-second lowering.":"Try to add one rep per set."}`};
  return top?{w:w+inc,text:`Last: <b>${w} kg × ${reps}</b>. You hit the top of the range, so go up to <b>${w+inc} kg</b>.`}:{w,text:`Last: <b>${w} kg × ${reps}</b>. Stay at ${w} kg and beat at least one rep.`};
}

  base(){return"data/users/"+this.uid},

  const nice=(()=>{const raw=maxV/3;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=[1,2,2.5,5,10].map(m=>m*p).find(m=>m>=raw);return n})();const top=nice*3;

let TMR=null,actx=null;

function tick(){const el=$("#timer");if(!TMR){el.hidden=true;return}const left=Math.max(0,(TMR.end-Date.now())/1000);
  el.hidden=false;el.innerHTML=`<div style="flex:1;min-width:0"><div class="lbl">Rest · next: ${esc(TMR.label)}</div><div class="t">${mmss(Math.ceil(left))}</div><div class="tb"><i style="width:${(1-left/TMR.total)*100}%"></i></div></div><button data-act="t15">+15 s</button><button data-act="tskip">Skip</button>`;
  if(left<=0){beep();TMR=null;setTimeout(()=>{$("#timer").hidden=true},600);toast("Rest over. Next set.");return}clearTimeout(tick._t);tick._t=setTimeout(tick,250)}

function aiErr(e){const c=e&&e.code;if(c==="cancelled")return"";

  water:b=>{const d=todayStr(),day=getDay(d);day.water=Math.max(0,(day.water||0)+ +b.dataset.ml);saveDay(d);render()},

  addcustom:()=>{const n=$("#cName").value.trim();const k=parseFloat($("#cK").value);if(!n||!k){toast("Enter a name and calories.");return}const d=todayStr(),day=getDay(d);day.meals.push({n,kcal:k,p:parseFloat($("#cP").value)||0,c:parseFloat($("#cC").value)||0,f:parseFloat($("#cF").value)||0});saveDay(d);render();toast("Added "+n)},
  delfood:b=>{const d=todayStr(),day=getDay(d);const m=day.meals.splice(+b.dataset.i,1)[0];saveDay(d);render();if(m&&m.photo&&ASSETS)ASSETS.delete(m.photo).catch(()=>{})},
  fanalyze:()=>analyzeFood(),
  fstop:()=>{if(FAI.ctl)FAI.ctl.abort()},
  ftoggle:b=>{const i=FAI.res.items[+b.dataset.i];i.off=!i.off;render()},
  fmult:b=>{FAI.mult=+b.dataset.m;render()},
  fadd:async b=>{b.disabled=true;const r=FAI.res,t=foodTotals();const photo=await storePhoto(FAI.blob);const d=todayStr(),day=getDay(d);
    day.meals.push({n:r.title+(FAI.mult!==1?` (×${FAI.mult})`:""),kcal:t.kcal,p:t.p,c:t.c,f:t.f,photo,ai:true,items:t.it.map(i=>i.name+(i.portion?" "+i.portion:"")).join(", ").slice(0,300)});
    saveDay(d);if(FAI.url)URL.revokeObjectURL(FAI.url);Object.assign(FAI,{file:null,blob:null,url:"",desc:"",res:null,err:"",mult:1});render();toast("Meal added")},
  pclear:b=>{const st=b.dataset.w==="food"?FAI:SCAN;if(st.url)URL.revokeObjectURL(st.url);Object.assign(st,{file:null,blob:null,url:"",res:null,err:""});render()},
  sanalyze:()=>analyzeScan(),
  sstop:()=>{if(SCAN.ctl)SCAN.ctl.abort()},
  ssave:async b=>{b.disabled=true;await saveCustom();render();toast("Saved to your exercises")},
  saddtoday:async()=>{const id=SCAN.res.matchId||await saveCustom();addToday(id)},
  addtoday:b=>{ACT.close();addToday(b.dataset.ex)},
  rmadded:b=>{const d=todayStr(),day=getDay(d);day.added=(day.added||[]).filter(x=>x!==b.dataset.ex);saveDay(d);render()},
  delcustom:b=>{const id=b.dataset.ex;const c=(S.profile.custom||[]).find(x=>x.id===id);S.profile.custom=(S.profile.custom||[]).filter(x=>x.id!==id);saveProfile();ACT.close();render();toast("Exercise deleted");if(c&&c.photo&&ASSETS)ASSETS.delete(c.photo).catch(()=>{})},
  askex:()=>{SCAN.desc=LIB.q.trim();window.scrollTo(0,0);analyzeScan()},
  savebw:()=>{const v=parseFloat($("#bwIn").value);if(!v||v<25||v>350){toast("Enter your weight in kg.");return}const d=todayStr(),day=getDay(d);day.bw=v;S.profile.weight=v;saveDay(d);saveProfile();render();toast("Weight saved")},
  saveprofile:()=>{const g=document.querySelector('input[name="goal"]:checked');const num=(id,lo,hi,def)=>{const v=parseFloat($(id).value);return v>=lo&&v<=hi?v:def};
    S.profile={goal:g?g.value:"muscle",level:$("#pLevel").value,days:+$("#pDays").value,equip:$("#pEquip").value,sex:$("#pSex").value,age:num("#pAge",13,90,28),height:num("#pHeight",120,230,175),weight:num("#pWeight",30,300,75),example:false,custom:S.profile.custom||[]};
    const d=todayStr();if(S.days[d]){S.days[d].swaps={};delete S.days[d].session;saveDay(d)}saveProfile();toast("Plan updated");location.hash="#today";render()},
  libm:b=>{LIB.m=b.dataset.m;render()},
  libe:b=>{LIB.e=b.dataset.e;render()},
  t15:()=>{if(TMR){TMR.end+=15000;TMR.total+=15;tick()}},
  tskip:()=>{TMR=null;tick()},
  askq:b=>{$("#askIn").value=b.textContent;ask(b.textContent)},
  ask:()=>ask($("#askIn").value)
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act](b,e);return}if(e.target.id==="sheet")ACT.close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)ACT.close()});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.draft){const dk=t.dataset.draft;DRAFT[dk]=Object.assign({},DRAFT[dk],{[t.dataset.f]:t.value})}
  if(t.type==="range"){const o=$("#"+t.id+"o");if(o)o.textContent=t.value+(t.id==="ciSleep"?" h":"/5")}
  if(t.id==="foodDesc")FAI.desc=t.value;
  if(t.id==="scanDesc")SCAN.desc=t.value;
  if(t.id==="libQ"){LIB.q=t.value;const pos=t.selectionStart;render();const n=$("#libQ");n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener("change",async e=>{
  if(["foodCam","foodFile","scanCam","scanFile"].includes(e.target.id)){const f=e.target.files&&e.target.files[0];if(!f)return;const st=e.target.id.startsWith("food")?FAI:SCAN;
    if(st.url)URL.revokeObjectURL(st.url);st.file=f;st.blob=await shrink(f);st.url=URL.createObjectURL(st.blob);st.res=null;st.err="";st.saved=null;render();return}
  if(e.target.id==="sessSel"){const d=todayStr(),day=getDay(d);day.session=e.target.value;day.swaps={};saveDay(d);render()}});
window.addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});

/* extra sets: rx sets count is extended by day.extra */
const _rx=rx;rx=function(ex,ready){const r=_rx(ex,ready);const day=S.days[todayStr()];if(day&&day.extra&&day.extra[ex.id])r.sets+=day.extra[ex.id];return r};

loadLocal();render();
let tries=0;(function waitClaude(){if(window.claude&&window.claude.use){Cloud.init();initSample()}else if(++tries<20)setTimeout(waitClaude,150)})();
</script>
